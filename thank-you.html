<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You</title>
  <style>
    body {
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }
    .thank-you {
      background: white;
      padding: 50px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .thank-you h1 {
      color: #28a745;
      margin-bottom: 20px;
      font-size: 2.5rem;
    }
    .thank-you p {
      color: #555;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }
    .thank-you a {
      display: inline-block;
      padding: 12px 25px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.3s ease;
    }
    .thank-you a:hover {
      background: #333;
    }
  </style>
</head>
<body>

  <div class="thank-you">
    <h1>✅ Thank You!</h1>
    <p>Your message has been sent.<br>We will contact you shortly.</p>
    <a href="index.html">Back to Home</a> <!-- This will take back to your main page -->
  </div>

</body>
</html>
